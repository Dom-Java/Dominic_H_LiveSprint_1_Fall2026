<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal view</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header_section"> 
        <h1>Welcome to the Interactive Reveal What’s that Animal UI</h1>
    </header>
    <section class="Description_section">
        <h2> Click on the buttons below to reveal the animal images </h2>
    </section>
    <section class="main_content">
        <!-- Animals -->
        <div class="animal_div" id="cat">
            <span>
                <img class="animal_img" src="tabby-cat.jpg" alt="">
            </span>
            <button type="button" id="hideCat" onclick = "hideCat()" > Hide Result</button>
        </div>
        <div class="animal_div" id="dog">
            <span>
                <img class="animal_img" src="dog.jpg" alt="">
            </span>
            <button type="button" id="hideDog" onclick = "hideDog()">Hide Result</button>
        </div>
        <div class="animal_div" id="cow">
            <span>
                <img class="animal_img" src="cow.jpg" alt="">
            </span>
            <button type="button" id="hideCow" onclick = "hideCow()">Hide Result</button>
        </div>
    </section>

   <section class="main_buttons">
     <!-- reveal buttons -->
        <div>
            <button type="button" id="showCat" onclick= "visibleCat()">Reveal a CAT</button>
        </div>
        <div>
            <button type="button" id="showDog" onclick= "visibleDog()">Reveal a DOG</button>
        </div>
        <div>
            <button type="button" id="showCow" onclick= "visibleCow()">Reveal a COW</button>
        </div>
   </section>
       
   <script src="app.js"></script>
</body>
</html>
