<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal view</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header_section"> 
        <h1>Welcome to the Interactive Reveal What’s that Animal UI</h1>
    </header>
    <section class="Description_section">
        <h2> Click on the buttons below to reveal the animal images </h2>
    </section>
    <section class="main_content">
        <!-- Animals -->
        <div class="animal_div">
            <span>
                <img class="animal_img" src="tabby-cat.jpg" alt="">
            </span>
            <button> Hide Result</button>
        </div>
        <div  >
            <span>
                <img class="animal_img" src="dog.jpg" alt="">
            </span>
            <button>Hide Result</button>
        </div>
        <div >
            <span>
                <img class="animal_img" src="cow.jpg" alt="">
            </span>
            <button>Hide Result</button>
        </div>
    </section>

   <section class="main_buttons">
     <!-- reveal buttons -->
        <div>
            <button>Reveal a CAT</button>
        </div>
        <div>
            <button>Reveal a DOG</button>
        </div>
        <div>
            <button>Reveal a COW</button>
        </div>
   </section>
       
   
</body>
</html>
